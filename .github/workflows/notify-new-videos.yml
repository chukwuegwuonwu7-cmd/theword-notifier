name: Notify new videos

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may delay this a few minutes)
  workflow_dispatch: {}     # also lets you run it by hand from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 pg@8
      - run: node notify-new-videos.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
